<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monn Studio — محیط ساخت بازی</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--panel2:#17243a;--line:#263651;--text:#e9f1ff;--muted:#8fa2bf;--cyan:#42d7e8;--violet:#9b8cff;--green:#63e6ad;--red:#ff7187}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#1b3154 0,transparent 45%),var(--bg);color:var(--text);font:14px/1.7 Tahoma,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;color:var(--text);background:#1c2b43;border:1px solid #334866;border-radius:10px;padding:8px 13px;transition:.18s}button:hover{border-color:var(--cyan);transform:translateY(-1px)}button.primary{background:linear-gradient(110deg,#087f91,#5145a8);border:0;font-weight:700}button.danger{color:#ff9aaa}input,textarea,select{width:100%;background:#0b1424;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--cyan)}textarea{min-height:90px;resize:vertical}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#0b1220eF;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#28c9d9,#7864f5);color:#06121c;font-weight:900}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:2px}.actions{display:flex;gap:8px;align-items:center}.status{font-size:11px;color:var(--green);margin-left:10px}.layout{display:grid;grid-template-columns:245px minmax(420px,1fr) 300px;gap:12px;padding:13px;height:calc(100vh - 68px);min-height:650px}.panel{background:linear-gradient(160deg,#121d30,#0e1727);border:1px solid var(--line);border-radius:15px;min-height:0;overflow:hidden;box-shadow:0 14px 50px #0003}.side{display:flex;flex-direction:column}.panel-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:700}.panel-body{padding:13px;overflow:auto}.muted{color:var(--muted);font-size:12px}.tabs{display:flex;gap:5px;padding:9px;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:6px 4px;font-size:12px}.tabs button.active{background:#253b59;border-color:var(--cyan);color:#9df5ff}.scene-list{display:grid;gap:7px;margin-top:12px}.scene-item{padding:10px;border:1px solid var(--line);border-radius:10px;background:#101b2d;text-align:right;display:flex;justify-content:space-between;align-items:center}.scene-item.active{border-color:var(--cyan);background:#123044}.scene-item b{display:block;font-size:12px}.scene-item small{color:var(--muted);font-size:10px}.workspace{display:flex;flex-direction:column;min-width:0}.workspace-tools{display:flex;align-items:center;gap:7px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}.workspace-tools span{margin-right:auto;color:var(--muted);font-size:11px}.canvas-wrap{position:relative;flex:1;overflow:auto;background-color:#0b1423;background-image:radial-gradient(#31425b 1px,transparent 1px);background-size:22px 22px}.canvas{position:relative;width:1500px;height:1000px}.wires{position:absolute;inset:0;width:1500px;height:1000px;pointer-events:none;overflow:visible}.wire{fill:none;stroke:#4bcbdc;stroke-width:2.4;opacity:.85}.node{position:absolute;width:210px;min-height:116px;background:linear-gradient(145deg,#1a2a42,#111c2e);border:1px solid #3b5876;border-radius:13px;box-shadow:0 12px 28px #0007;cursor:grab;user-select:none}.node.selected{border:2px solid var(--cyan);box-shadow:0 0 0 4px #42d7e81c,0 14px 30px #0008}.node-title{padding:8px 11px;background:#213653;border-radius:11px 11px 0 0;display:flex;justify-content:space-between;font-weight:700}.node-body{padding:10px;font-size:11px;color:#b5c5db}.node-port{position:absolute;left:-7px;top:47px;width:14px;height:14px;background:var(--cyan);border:3px solid #102137;border-radius:50%;cursor:crosshair}.node-start .node-title{background:#175b5d}.node-end .node-title{background:#57344b}.hint{position:absolute;bottom:14px;right:15px;color:#8196b4;background:#101c2cdd;border:1px solid var(--line);padding:7px 11px;border-radius:9px;font-size:11px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:11px;color:#a9bad1}.section-title{font-size:12px;color:#80dce8;margin:17px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}.choice-card,.character-card,.asset-card{padding:9px;border:1px solid var(--line);border-radius:10px;margin:7px 0;background:#0d1728}.choice-card .field{margin:7px 0}.row{display:flex;gap:7px}.row>*{flex:1}.empty{padding:22px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:18px;left:18px;padding:10px 15px;background:#183d3c;border:1px solid #347f70;border-radius:10px;z-index:10;display:none}.modal{position:fixed;inset:0;background:#020611bb;z-index:20;display:none;place-items:center;padding:20px}.modal.open{display:grid}.modal-card{width:min(800px,100%);max-height:85vh;overflow:auto;background:#101b2d;border:1px solid #3a526f;border-radius:16px;padding:18px}.preview{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:white}.help{line-height:2.1}.kbd{border:1px solid #40536d;border-radius:5px;padding:1px 5px;color:#c4d7ed;font-size:10px}
@media(max-width:1050px){.layout{grid-template-columns:205px minmax(300px,1fr);height:auto}.inspector{grid-column:1/-1;min-height:400px}.canvas-wrap{min-height:620px}}@media(max-width:650px){.top{padding:0 10px}.brand{font-size:14px}.actions button{padding:6px;font-size:11px}.layout{display:flex;flex-direction:column;height:auto;padding:8px}.side{min-height:250px}.workspace{min-height:600px}.inspector{min-height:430px}.canvas-wrap{min-height:520px}}
</style></head>
<body>
<header class="top"><div class="brand"><div class="logo">M</div><div>MONN STUDIO<small>GAME CREATION ENVIRONMENT</small></div><span class="status" id="saveStatus">● آماده</span></div><div class="actions"><button onclick="newProject()">پروژه تازه</button><button onclick="openProject()">بازکردن MONN</button><button onclick="saveMonn()">ذخیرهٔ MONN</button><button onclick="openGameSettings()">رابط و منو</button><button onclick="preview()">▶ پیش‌نمایش زنده</button><button class="primary" onclick="buildGame()">⚡ ساخت بازی وب</button></div></header>
<main class="layout">
<aside class="panel side"><div class="panel-head">پروژه و صحنه‌ها <button onclick="addScene()">＋ صحنه</button></div><div class="tabs"><button class="active" id="tabScenes" onclick="showLeft('scenes')">صحنه‌ها</button><button id="tabChars" onclick="showLeft('chars')">شخصیت‌ها</button><button id="tabAssets" onclick="showLeft('assets')">دارایی‌ها</button><button id="tabQuests" onclick="showLeft('quests')">مأموریت‌ها</button><button id="tabWorld" onclick="showLeft('world')">جهان 2D</button></div><div class="panel-body" id="leftContent"></div></aside>
<section class="panel workspace"><div class="workspace-tools"><button onclick="addScene()">＋ ساخت صحنه</button><button onclick="autoLayout()">چیدمان خودکار</button><button onclick="fitCanvas()">نمایش همه</button><span>برای جابه‌جایی بکش · برای اتصال، در انتخاب روی «اتصال روی نقشه» بزن و مقصد را انتخاب کن</span></div><div class="canvas-wrap" id="canvasWrap"><div class="canvas" id="canvas"><svg class="wires" id="wires"></svg><div class="hint">نقشهٔ داستان · صحنه‌ها را به هم وصل کن</div></div></div></section>
<aside class="panel side inspector"><div class="panel-head">بازرس صحنه <span class="muted" id="inspectId">—</span></div><div class="panel-body" id="inspector"><div class="empty">یک صحنه را از نقشه انتخاب کن تا ویرایشش کنی.</div></div></aside>
</main><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modal-card"><div class="panel-head">پیش‌نمایش بازی <button onclick="closePreview()">بستن</button></div><iframe class="preview" id="preview"></iframe></div></div>
<input type="file" id="projectFile" accept=".monn,.json" hidden onchange="readProject(event)"><input type="file" id="assetFile" accept="image/*,audio/*,video/mp4,video/webm,.glb,.gltf,.obj" hidden onchange="readAsset(event)">
<script>
const $=id=>document.getElementById(id);let active='start',leftTab='scenes',drag=null,connect=null,project;
const fresh=()=>({meta:{id:'my-monn-game',title:'بازی تازه من',start_scene:'start'},ui:{menu_enabled:true,start_label:'شروع بازی',settings_label:'تنظیمات',show_health:true,show_inventory:true,show_quests:true,elements:[]},world:{enabled:false,width:800,height:450,sprites:[],player:{x:40,y:40,width:28,height:40,speed:3,color:'#42d7e8'}},player:{health:100,max_health:100,stats:{سکه:0},inventory:[]},characters:[],quests:[],scenes:[{id:'start',title:'آغاز ماجراجویی',text:'داستان از اینجا شروع می‌شود. اولین انتخابت را انجام بده.',choices:[{id:'continue',text:'شروع ماجراجویی',target:'end',conditions:[],effects:[]}]},{id:'end',title:'پایان',text:'این پایان نمونه است. حالا داستان خودت را بساز.',choices:[]}]});
project=fresh();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
function persist(){try{localStorage.setItem('monn-studio-project',JSON.stringify(project));$('saveStatus').textContent='● ذخیرهٔ محلی';}catch(e){$('saveStatus').textContent='● حافظه پر است';}}
function loadLocal(){try{const p=JSON.parse(localStorage.getItem('monn-studio-project'));if(p?.scenes?.length)project=p;}catch(e){}}
function scene(id){return project.scenes.find(s=>s.id===id)}
function showLeft(tab){leftTab=tab;['Scenes','Chars','Assets','Quests','World'].forEach((v)=>$('tab'+v).classList.toggle('active',v.toLowerCase()===tab));renderLeft()}
function renderLeft(){const root=$('leftContent');if(leftTab==='scenes'){root.innerHTML='<div class="field"><label>نام بازی</label><input value="'+esc(project.meta.title||'')+'" onchange="project.meta.title=this.value;persist()"></div><div class="muted">هر کارت یک بخش از بازی است. روی کارت بزن تا ویرایش شود.</div><div class="scene-list">'+project.scenes.map(s=>'<button class="scene-item '+(s.id===active?'active':'')+'" onclick="selectScene(\''+esc(s.id)+'\')"><span><b>'+esc(s.title||s.id)+'</b><small>'+esc(s.id)+' · '+(s.choices||[]).length+' مسیر</small></span><span>◇</span></button>').join('')+'</div>';}else if(leftTab==='chars'){root.innerHTML='<button class="primary" onclick="addCharacter()">＋ افزودن شخصیت</button><p class="muted">شخصیت‌ها را تعریف کن و در دیالوگ صحنه‌ها به کار ببر.</p>'+project.characters.map((c,i)=>'<div class="character-card"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.id)+'</div><button onclick="editCharacter('+i+')">ویرایش</button> <button onclick="useAssetCharacter('+i+')">تصویر از دارایی‌ها</button> <button class="danger" onclick="removeCharacter('+i+')">حذف</button></div>').join('');}else if(leftTab==='quests'){root.innerHTML='<button class="primary" onclick="addQuest()">＋ تعریف مأموریت</button><p class="muted">مأموریت‌ها را بساز و در شرط‌ها و اثرهای انتخاب به کار ببر.</p>'+project.quests.map((q,i)=>'<div class="character-card"><b>'+esc(q.title||q.id)+'</b><div class="muted">'+esc(q.id)+'</div><button onclick="editQuest('+i+')">ویرایش</button> <button class="danger" onclick="removeQuest('+i+')">حذف</button></div>').join('')||'<div class="empty">هنوز مأموریتی تعریف نشده است.</div>';}else if(leftTab==='world'){renderWorldEditor(root);return;}else{root.innerHTML='<button class="primary" onclick="$(\'assetFile\').click()">＋ واردکردن تصویر / صدا / ویدیو / مدل</button><p class="muted">دارایی‌ها داخل فایل پروژهٔ MONN جاسازی می‌شوند؛ برای خروجی مستقل نیاز به پوشهٔ جداگانه ندارند.</p>'+((project.assets||[]).map((a,i)=>'<div class="asset-card">'+(a.kind==='image'?'<img src="'+a.data+'" style="width:100%;max-height:90px;object-fit:cover;border-radius:7px">':a.kind==='video'?'<video src="'+a.data+'" controls muted style="width:100%;max-height:90px"></video>':a.kind==='model'?'◇ 3D':'♫ ')+esc(a.name)+'<div class="muted">'+a.kind+'</div><button onclick="useAsset('+i+')">استفاده در صحنه</button> <button class="danger" onclick="removeAsset('+i+')">حذف</button></div>').join('')||'<div class="empty">هنوز فایلی وارد نشده است.</div>')}}
function render(){renderLeft();renderGraph();renderInspector();persist()}
function renderGraph(){const canvas=$('canvas'),old=[...canvas.querySelectorAll('.node')];old.forEach(n=>n.remove());const svg=$('wires');svg.innerHTML='';project.scenes.forEach((s,i)=>{if(!s.pos)s.pos={x:90+(i%4)*300,y:90+Math.floor(i/4)*230};const n=document.createElement('div');n.className='node '+(s.id===active?'selected ':'')+(s.id===project.meta.start_scene?'node-start ':'')+(!(s.choices||[]).length?'node-end':'');n.style.left=s.pos.x+'px';n.style.top=s.pos.y+'px';n.dataset.id=s.id;n.innerHTML='<div class="node-title"><span>'+esc(s.title||s.id)+'</span><small>'+esc(s.id)+'</small></div><div class="node-body">'+esc((s.text||'متن صحنه خالی است').slice(0,90))+'<br>↗ '+(s.choices||[]).length+' انتخاب</div><div class="node-port" title="اتصال به صحنه دیگر"></div>';n.addEventListener('pointerdown',e=>{if(connect&&connect.from!==s.id){const src=scene(connect.from);const c=(src.choices||[]).find(x=>x.id===connect.choice);if(c){c.target=s.id;toast('مسیر داستان وصل شد')}connect=null;render();e.preventDefault();return}if(e.target.classList.contains('node-port')){toast('برای اتصال، از دکمه «اتصال روی نقشه» در انتخاب استفاده کن');e.preventDefault();return}selectScene(s.id);drag={id:s.id,x:e.clientX,y:e.clientY,ox:s.pos.x,oy:s.pos.y};n.setPointerCapture(e.pointerId)});n.addEventListener('pointermove',e=>{if(!drag||drag.id!==s.id)return;s.pos.x=Math.max(0,drag.ox+e.clientX-drag.x);s.pos.y=Math.max(0,drag.oy+e.clientY-drag.y);n.style.left=s.pos.x+'px';n.style.top=s.pos.y+'px';drawWires()});n.addEventListener('pointerup',e=>{if(drag?.id===s.id){drag=null;persist()}});n.addEventListener('click',e=>{if(connect&&connect.from!==s.id){const src=scene(connect.from);const c=(src.choices||[]).find(x=>x.id===connect.choice);if(c){c.target=s.id;toast('مسیر داستان وصل شد')}connect=null;render()} });canvas.append(n)});drawWires()}
function drawWires(){const svg=$('wires');svg.innerHTML='';project.scenes.forEach(s=>(s.choices||[]).forEach(c=>{const t=scene(c.target);if(!t)return;const x1=s.pos.x+210,y1=s.pos.y+60+(s.choices.indexOf(c)*12),x2=t.pos.x,y2=t.pos.y+55;const dx=Math.max(45,(x2-x1)*.5);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);p.setAttribute('class','wire');svg.append(p)}))}
function selectScene(id){active=id;renderLeft();document.querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.id===id));renderInspector()}
function field(label,key,value,type='text'){return '<div class="field"><label>'+label+'</label><input data-key="'+key+'" value="'+esc(value)+'" type="'+type+'"></div>'}
function renderInspector(){const s=scene(active);$('inspectId').textContent=s?.id||'—';if(!s){$('inspector').innerHTML='<div class="empty">صحنه انتخاب نشده است.</div>';return}
$('inspector').innerHTML=field('شناسه یکتا','id',s.id)+field('عنوان صحنه','title',s.title)+ '<div class="field"><label>روایت و توضیحات صحنه</label><textarea data-key="text">'+esc(s.text)+'</textarea></div>'+field('تصویر پس‌زمینه (دارایی یا نشانی امن)','image',s.image||'')+field('موسیقی پس‌زمینه','music',s.music||'')+field('ویدیوی صحنه (MP4/WebM)','video',s.video||'')+field('مدل سه‌بعدی صحنه (GLB/GLTF)','model',s.model||'')+field('صدای دکمه‌های این صحنه','button_sound',s.button_sound||'')+'<div class="section-title">گفت‌وگو و دیالوگ شخصیت‌ها</div><div id="dialogues">'+(s.dialogue||[]).map((line,i)=>dialogueEditor(line,i)).join('')+'</div><button onclick="addDialogue()">＋ افزودن دیالوگ</button><div class="section-title">انتخاب‌ها و مسیرهای داستان</div><div id="choices">'+(s.choices||[]).map((c,i)=>choiceEditor(c,i)).join('')+'</div><button class="primary" onclick="addChoice()">＋ افزودن انتخاب</button><div class="section-title">مدیریت صحنه</div><div class="row"><button onclick="duplicateScene()">تکثیر</button><button class="danger" onclick="deleteScene()">حذف صحنه</button></div><div class="field"><label><input id="isStart" type="checkbox" style="width:auto" '+(project.meta.start_scene===s.id?'checked':'')+' onchange="setStart()"> این صحنه، شروع بازی باشد</label></div>';
$('inspector').querySelectorAll('[data-key]').forEach(el=>el.addEventListener('change',()=>{s[el.dataset.key]=(el.dataset.key==='image'||el.dataset.key==='music')?(el.value||null):el.value;if(el.dataset.key==='id'){const old=active,newId=el.value.trim();if(!newId||project.scenes.some(x=>x!==s&&x.id===newId)){toast('شناسه خالی یا تکراری است');el.value=old;return}project.scenes.forEach(x=>(x.choices||[]).forEach(c=>{if(c.target===old)c.target=newId}));if(project.meta.start_scene===old)project.meta.start_scene=newId;active=newId}render()}))}
function choiceEditor(c,i){return '<div class="choice-card"><div class="field"><label>متن انتخاب</label><input value="'+esc(c.text)+'" onchange="editChoice('+i+',\'text\',this.value)"></div><div class="field"><label>مقصد مسیر</label><select onchange="editChoice('+i+',\'target\',this.value)"><option value="">پایان بازی</option>'+project.scenes.map(x=>'<option value="'+esc(x.id)+'" '+(c.target===x.id?'selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select></div><div class="row"><button onclick="editLogic('+i+')">شرط و اثر</button><button class="danger" onclick="removeChoice('+i+')">حذف</button></div><button style="margin-top:7px" onclick="beginConnect('+i+')">اتصال روی نقشه</button></div>'}
function dialogueEditor(line,i){const ch=project.characters.find(c=>c.id===line.character)||{};return '<div class="choice-card"><div class="field"><label>شخصیت</label><select onchange="editDialogue('+i+',\'character\',this.value)"><option value="">راوی</option>'+project.characters.map(c=>'<option value="'+esc(c.id)+'" '+(line.character===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>متن دیالوگ</label><textarea onchange="editDialogue('+i+',\'text\',this.value)">'+esc(line.text||'')+'</textarea></div><div class="field"><label>حالت چهره / انیمیشن</label><select onchange="editDialogue('+i+',\'expression\',this.value)"><option value="">پیش‌فرض</option>'+Object.keys(ch.expressions||{}).map(x=>'<option '+(line.expression===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div><div class="row"><div class="field"><label>ویدیوی اختصاصی این دیالوگ</label><input value="'+esc(line.video||'')+'" onchange="editDialogue('+i+',\'video\',this.value)"></div><div class="field"><label>صدای دیالوگ</label><input value="'+esc(line.voice||'')+'" onchange="editDialogue('+i+',\'voice\',this.value)"></div></div><button class="danger" onclick="removeDialogue('+i+')">حذف دیالوگ</button></div>'}
function addDialogue(){scene(active).dialogue=scene(active).dialogue||[];scene(active).dialogue.push({character:project.characters[0]?.id||null,text:'متن دیالوگ...'});renderInspector();persist()}
function editDialogue(i,k,v){scene(active).dialogue[i][k]=(k==='character'&&!v)?null:v;persist()}
function removeDialogue(i){scene(active).dialogue.splice(i,1);renderInspector();persist()}
function editChoice(i,k,v){scene(active).choices[i][k]=v||null;renderGraph();persist()}
function addChoice(){scene(active).choices.push({id:'choice_'+Date.now(),text:'انتخاب جدید',target:null,conditions:[],effects:[]});renderInspector();renderGraph();persist()}
function removeChoice(i){scene(active).choices.splice(i,1);renderInspector();renderGraph();persist()}
function beginConnect(i){connect={from:active,choice:scene(active).choices[i].id};toast('اکنون روی کارت صحنهٔ مقصد کلیک کن.')}

function beginSpriteDrag(e,id){spriteDrag={id,x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId);e.preventDefault()}
window.addEventListener('pointermove',e=>{if(!spriteDrag)return;const board=$('worldBoard');if(!board)return;const rect=board.getBoundingClientRect(),w=project.world.width,h=project.world.height,s=project.world.sprites.find(x=>x.id===spriteDrag.id);if(!s)return;s.x=Math.max(0,Math.min(w-s.width,(e.clientX-rect.left)/rect.width*w-s.width/2));s.y=Math.max(0,Math.min(h-s.height,(e.clientY-rect.top)/rect.height*h-s.height/2));const el=board.querySelector('[data-world-id="'+spriteDrag.id+'"]');if(el){el.style.left=s.x/w*100+'%';el.style.top=s.y/h*100+'%'}});
window.addEventListener('pointerup',()=>{if(spriteDrag){spriteDrag=null;persist()}});
function addConditionRow(){logicConditions.push({type:'stat',name:'سکه',op:'>=',value:1});renderLogicEditor()}
function addEffectRow(){logicEffects.push({type:'stat',name:'سکه',op:'add',value:1});renderLogicEditor()}
function renderLogicEditor(){const card=$('modal').querySelector('.modal-card');const cond=logicConditions.map((c,i)=>'<div class="choice-card"><div class="row"><div class="field"><label>نوع شرط</label><select id="ct'+i+'">'+['stat','health','item','flag','quest'].map(x=>'<option '+(c.type===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>نام / شناسه</label><input id="cn'+i+'" value="'+esc(c.name||'')+'"></div></div><div class="row"><div class="field"><label>عملگر</label><select id="co'+i+'">'+['==','!=','>','<','>=','<='].map(x=>'<option '+(c.op===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>مقدار</label><input id="cv'+i+'" value="'+esc(c.value??'')+'"></div></div><button class="danger" onclick="logicConditions.splice('+i+',1);renderLogicEditor()">حذف شرط</button></div>').join('');const eff=logicEffects.map((c,i)=>'<div class="choice-card"><div class="row"><div class="field"><label>نوع اثر</label><select id="et'+i+'">'+['stat','health','item','flag','quest','journal'].map(x=>'<option '+(c.type===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>نام / شناسه</label><input id="en'+i+'" value="'+esc(c.name||'')+'"></div></div><div class="row"><div class="field"><label>عملیات</label><select id="eo'+i+'">'+['add','set','subtract','remove','start','complete','fail'].map(x=>'<option '+((c.op||c.action)===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>مقدار / متن</label><input id="ev'+i+'" value="'+esc(c.value??c.count??c.text??'')+'"></div></div><button class="danger" onclick="logicEffects.splice('+i+',1);renderLogicEditor()">حذف اثر</button></div>').join('');card.innerHTML='<div class="panel-head">ویرایشگر بصری منطق انتخاب <button onclick="closePreview()">بستن</button></div><p class="muted">شرط‌ها باید همگی برقرار باشند تا انتخاب نمایش داده شود. اثرها پس از انتخاب اجرا می‌شوند.</p><div class="section-title">شرط‌ها</div>'+cond+'<button onclick="addConditionRow()">＋ افزودن شرط</button><div class="section-title">رویدادها و اثرها</div>'+eff+'<button onclick="addEffectRow()">＋ افزودن اثر</button><div style="margin-top:15px"><button class="primary" onclick="saveLogicEditor()">ذخیره منطق</button></div>';$('modal').classList.add('open')}
function editLogic(i){logicChoiceIndex=i;const c=scene(active).choices[i];logicConditions=JSON.parse(JSON.stringify(c.conditions||[]));logicEffects=JSON.parse(JSON.stringify(c.effects||[]));renderLogicEditor()}
function saveLogicEditor(){const c=scene(active).choices[logicChoiceIndex];c.conditions=logicConditions.map((_,i)=>{const type=$('ct'+i).value,name=$('cn'+i).value.trim(),op=$('co'+i).value,raw=$('cv'+i).value;return {type,name,op,value:type==='flag'?raw==='true':type==='quest'?raw:Number(raw)}});c.effects=logicEffects.map((_,i)=>{const type=$('et'+i).value,name=$('en'+i).value.trim(),operation=$('eo'+i).value,raw=$('ev'+i).value;if(type==='journal')return {type,text:raw};if(type==='item')return {type,name,action:operation,count:Math.max(0,Number(raw)||1)};if(type==='quest')return {type,name,action:operation};if(type==='flag')return {type,name,value:raw==='true'};return {type,name,op:operation,value:Number(raw)||0}});closePreview();renderInspector();renderGraph();persist();toast('شرط‌ها و رویدادها ذخیره شدند')}

ensureProjectShape();
loadLocal();ensureProjectShape();active=project.meta.start_scene;render();
</script></body></html>
