<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monn Studio — محیط ساخت بازی</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--panel2:#17243a;--line:#263651;--text:#e9f1ff;--muted:#8fa2bf;--cyan:#42d7e8;--violet:#9b8cff;--green:#63e6ad;--red:#ff7187}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#1b3154 0,transparent 45%),var(--bg);color:var(--text);font:14px/1.7 Tahoma,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;color:var(--text);background:#1c2b43;border:1px solid #334866;border-radius:10px;padding:8px 13px;transition:.18s}button:hover{border-color:var(--cyan);transform:translateY(-1px)}button.primary{background:linear-gradient(110deg,#087f91,#5145a8);border:0;font-weight:700}button.danger{color:#ff9aaa}input,textarea,select{width:100%;background:#0b1424;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--cyan)}textarea{min-height:90px;resize:vertical}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#0b1220eF;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#28c9d9,#7864f5);color:#06121c;font-weight:900}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:2px}.actions{display:flex;gap:8px;align-items:center}.status{font-size:11px;color:var(--green);margin-left:10px}.layout{display:grid;grid-template-columns:245px minmax(420px,1fr) 300px;gap:12px;padding:13px;height:calc(100vh - 68px);min-height:650px}.panel{background:linear-gradient(160deg,#121d30,#0e1727);border:1px solid var(--line);border-radius:15px;min-height:0;overflow:hidden;box-shadow:0 14px 50px #0003}.side{display:flex;flex-direction:column}.panel-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:700}.panel-body{padding:13px;overflow:auto}.muted{color:var(--muted);font-size:12px}.tabs{display:flex;gap:5px;padding:9px;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:6px 4px;font-size:12px}.tabs button.active{background:#253b59;border-color:var(--cyan);color:#9df5ff}.scene-list{display:grid;gap:7px;margin-top:12px}.scene-item{padding:10px;border:1px solid var(--line);border-radius:10px;background:#101b2d;text-align:right;display:flex;justify-content:space-between;align-items:center}.scene-item.active{border-color:var(--cyan);background:#123044}.scene-item b{display:block;font-size:12px}.scene-item small{color:var(--muted);font-size:10px}.workspace{display:flex;flex-direction:column;min-width:0}.workspace-tools{display:flex;align-items:center;gap:7px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}.workspace-tools span{margin-right:auto;color:var(--muted);font-size:11px}.canvas-wrap{position:relative;flex:1;overflow:auto;background-color:#0b1423;background-image:radial-gradient(#31425b 1px,transparent 1px);background-size:22px 22px}.canvas{position:relative;width:1500px;height:1000px}.wires{position:absolute;inset:0;width:1500px;height:1000px;pointer-events:none;overflow:visible}.wire{fill:none;stroke:#4bcbdc;stroke-width:2.4;opacity:.85}.node{position:absolute;width:210px;min-height:116px;background:linear-gradient(145deg,#1a2a42,#111c2e);border:1px solid #3b5876;border-radius:13px;box-shadow:0 12px 28px #0007;cursor:grab;user-select:none}.node.selected{border:2px solid var(--cyan);box-shadow:0 0 0 4px #42d7e81c,0 14px 30px #0008}.node-title{padding:8px 11px;background:#213653;border-radius:11px 11px 0 0;display:flex;justify-content:space-between;font-weight:700}.node-body{padding:10px;font-size:11px;color:#b5c5db}.node-port{position:absolute;left:-7px;top:47px;width:14px;height:14px;background:var(--cyan);border:3px solid #102137;border-radius:50%;cursor:crosshair}.node-start .node-title{background:#175b5d}.node-end .node-title{background:#57344b}.hint{position:absolute;bottom:14px;right:15px;color:#8196b4;background:#101c2cdd;border:1px solid var(--line);padding:7px 11px;border-radius:9px;font-size:11px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:11px;color:#a9bad1}.section-title{font-size:12px;color:#80dce8;margin:17px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}.choice-card,.character-card,.asset-card{padding:9px;border:1px solid var(--line);border-radius:10px;margin:7px 0;background:#0d1728}.choice-card .field{margin:7px 0}.row{display:flex;gap:7px}.row>*{flex:1}.empty{padding:22px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:18px;left:18px;padding:10px 15px;background:#183d3c;border:1px solid #347f70;border-radius:10px;z-index:10;display:none}.modal{position:fixed;inset:0;background:#020611bb;z-index:20;display:none;place-items:center;padding:20px}.modal.open{display:grid}.modal-card{width:min(800px,100%);max-height:85vh;overflow:auto;background:#101b2d;border:1px solid #3a526f;border-radius:16px;padding:18px}.preview{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:white}.help{line-height:2.1}.kbd{border:1px solid #40536d;border-radius:5px;padding:1px 5px;color:#c4d7ed;font-size:10px}
@media(max-width:1050px){.layout{grid-template-columns:205px minmax(300px,1fr);height:auto}.inspector{grid-column:1/-1;min-height:400px}.canvas-wrap{min-height:620px}}@media(max-width:650px){.top{padding:0 10px}.brand{font-size:14px}.actions button{padding:6px;font-size:11px}.layout{display:flex;flex-direction:column;height:auto;padding:8px}.side{min-height:250px}.workspace{min-height:600px}.inspector{min-height:430px}.canvas-wrap{min-height:520px}}

/* Monn Studio visual timeline + drag UI designer */
.timeline-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.timeline-ruler{display:grid;grid-template-columns:150px 1fr;color:#91a8c5;font-size:11px}.timeline-ruler>div:last-child{display:flex;justify-content:space-between;border-bottom:1px solid #40536d;padding:5px}.timeline-track{display:grid;grid-template-columns:150px 1fr;min-height:58px;border-bottom:1px solid #263651}.timeline-track-name{padding:12px 8px;color:#a9bad1;font-size:12px}.timeline-lane{position:relative;background:repeating-linear-gradient(90deg,#18283c 0,#18283c 1px,transparent 1px,transparent 10%);min-width:0}.timeline-clip{position:absolute;top:9px;height:38px;min-width:28px;border:1px solid #54cbd8;border-radius:7px;background:#155568;padding:4px 7px;font-size:11px;cursor:grab;overflow:hidden;white-space:nowrap}.timeline-clip.audio{background:#493d78;border-color:#a998ff}.timeline-clip.animation{background:#225b43;border-color:#63e6ad}.timeline-inspector{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.designer-layout{display:grid;grid-template-columns:190px minmax(300px,1fr) 210px;gap:10px}.designer-tools,.designer-inspector{background:#0c1627;border:1px solid #263651;border-radius:10px;padding:10px}.designer-canvas-wrap{background:#091321;border:1px solid #334866;border-radius:10px;overflow:auto;min-height:420px;padding:12px}.designer-canvas{position:relative;width:720px;height:405px;background:linear-gradient(135deg,#162a42,#0e1727);border:1px dashed #526d8e;overflow:hidden}.designer-item{position:absolute;min-width:70px;min-height:34px;border:1px dashed #67dce8;border-radius:6px;padding:6px;cursor:move;user-select:none;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.designer-item.selected{outline:2px solid #f5c76b;outline-offset:2px}.designer-item button{pointer-events:none}.designer-item .resize-handle{position:absolute;left:0;bottom:0;width:12px;height:12px;background:#f5c76b;cursor:nwse-resize}.designer-tools button{width:100%;margin:3px 0}.designer-inspector .field{margin-bottom:8px}.designer-inspector input,.designer-inspector select{font-size:12px;padding:6px}

/* Monn 3D scene viewport */
.world3d-viewport{position:relative;background:radial-gradient(ellipse at center,#1a2d47,#07101d);border:1px solid #38516f;border-radius:12px;overflow:hidden;margin:10px 0}.world3d-viewport canvas{display:block;width:100%;height:330px;touch-action:none;cursor:crosshair}.world3d-overlay{position:absolute;top:8px;right:9px;pointer-events:none;background:#07101dcc;border:1px solid #40536d;border-radius:7px;padding:4px 8px;font-size:10px;color:#b7cce6}.world3d-actions{display:flex;gap:6px;flex-wrap:wrap}.world3d-actions button{flex:1;min-width:90px}.world3d-object{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px;border:1px solid #263651;border-radius:9px;margin:6px 0;background:#0b1525}.world3d-object.active{border-color:#42d7e8;background:#123044}.world3d-object button{padding:5px 8px;font-size:11px}
.world3d-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.world3d-toolbar button.active{border-color:#42d7e8;background:#124457;color:#fff}.world3d-viewport canvas{height:420px;background:#07101d}.world3d-overlay{z-index:2}.world3d-hint{font-size:11px;color:#9fb5d1;padding:4px 2px}
</style></head>
<body>
<header class="top"><div class="brand"><div class="logo">M</div><div>MONN STUDIO<small>GAME CREATION ENVIRONMENT</small></div><span class="status" id="saveStatus">● آماده</span></div><div class="actions"><button onclick="openAccount()">حساب کاربری</button><button onclick="openNitro()">✦ نیترو AI</button><button onclick="newProject()">پروژه تازه</button><button onclick="openProject()">بازکردن MONN</button><button onclick="saveMonn()">ذخیرهٔ MONN</button><button onclick="openGameSettings()">رابط و منو</button><button onclick="openUIDesigner()">طراح کشیدنی رابط</button><button onclick="openTimelineEditor()">تایم‌لاین</button><button onclick="preview()">▶ پیش‌نمایش زنده</button><button class="primary" onclick="buildGame()">⚡ ساخت بازی وب</button></div></header>
<main class="layout">
<aside class="panel side"><div class="panel-head">پروژه و صحنه‌ها <button onclick="addScene()">＋ صحنه</button></div><div class="tabs"><button class="active" id="tabScenes" onclick="showLeft('scenes')">صحنه‌ها</button><button id="tabChars" onclick="showLeft('chars')">شخصیت‌ها</button><button id="tabAssets" onclick="showLeft('assets')">دارایی‌ها</button><button id="tabQuests" onclick="showLeft('quests')">مأموریت‌ها</button><button id="tabWorld" onclick="showLeft('world')">جهان 2D</button><button id="tabWorld3D" onclick="showLeft('world3d')">جهان 3D</button></div><div class="panel-body" id="leftContent"></div></aside>
<section class="panel workspace"><div class="workspace-tools"><button onclick="addScene()">＋ ساخت صحنه</button><button onclick="autoLayout()">چیدمان خودکار</button><button onclick="fitCanvas()">نمایش همه</button><span>برای جابه‌جایی بکش · برای اتصال، در انتخاب روی «اتصال روی نقشه» بزن و مقصد را انتخاب کن</span></div><div class="canvas-wrap" id="canvasWrap"><div class="canvas" id="canvas"><svg class="wires" id="wires"></svg><div class="hint">نقشهٔ داستان · صحنه‌ها را به هم وصل کن</div></div></div></section>
<aside class="panel side inspector"><div class="panel-head">بازرس صحنه <span class="muted" id="inspectId">—</span></div><div class="panel-body" id="inspector"><div class="empty">یک صحنه را از نقشه انتخاب کن تا ویرایشش کنی.</div></div></aside>
</main><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modal-card"><div class="panel-head">پیش‌نمایش بازی <button onclick="closePreview()">بستن</button></div><iframe class="preview" id="preview"></iframe></div></div>
<input type="file" id="projectFile" accept=".monn,.json" hidden onchange="readProject(event)"><input type="file" id="assetFile" accept="image/*,audio/*,video/mp4,video/webm,.glb,.gltf" hidden onchange="readAsset(event)">
<script>
const $=id=>document.getElementById(id);let active='start',leftTab='scenes',drag=null,connect=null,project;
const fresh=()=>({meta:{id:'my-monn-game',title:'بازی تازه من',start_scene:'start'},ui:{menu_enabled:true,start_label:'شروع بازی',settings_label:'تنظیمات',show_health:true,show_inventory:true,show_quests:true,elements:[]},world:{enabled:false,width:800,height:450,sprites:[],player:{x:40,y:40,width:28,height:40,speed:3,color:'#42d7e8'}},player:{health:100,max_health:100,stats:{سکه:0},inventory:[]},characters:[],quests:[],scenes:[{id:'start',title:'آغاز ماجراجویی',text:'داستان از اینجا شروع می‌شود. اولین انتخابت را انجام بده.',choices:[{id:'continue',text:'شروع ماجراجویی',target:'end',conditions:[],effects:[]}]},{id:'end',title:'پایان',text:'این پایان نمونه است. حالا داستان خودت را بساز.',choices:[]}]});
project=fresh();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
function persist(){const data=JSON.stringify(project);if(!window.indexedDB){try{localStorage.setItem('monn-studio-project',data);$('saveStatus').textContent='● ذخیرهٔ محلی';}catch(e){$('saveStatus').textContent='● فضای ذخیره کافی نیست';}return}try{const req=indexedDB.open('monn-studio-db',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('projects'))req.result.createObjectStore('projects')};req.onsuccess=()=>{const tx=req.result.transaction('projects','readwrite');tx.objectStore('projects').put(data,'current');tx.oncomplete=()=>{$('saveStatus').textContent='● ذخیرهٔ خودکار';req.result.close()};tx.onerror=()=>{$('saveStatus').textContent='● خطای ذخیره';req.result.close()}};req.onerror=()=>{$('saveStatus').textContent='● خطای پایگاه داده'}}catch(e){$('saveStatus').textContent='● خطای ذخیره'}}
function loadLocal(){return new Promise(resolve=>{if(!window.indexedDB){try{const p=JSON.parse(localStorage.getItem('monn-studio-project'));if(p?.scenes?.length)project=p}catch(e){}resolve();return}const req=indexedDB.open('monn-studio-db',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('projects'))req.result.createObjectStore('projects')};req.onsuccess=()=>{const db=req.result,tx=db.transaction('projects','readonly'),get=tx.objectStore('projects').get('current');get.onsuccess=()=>{try{if(get.result){const p=JSON.parse(get.result);if(p?.scenes?.length)project=p}else{const legacy=JSON.parse(localStorage.getItem('monn-studio-project'));if(legacy?.scenes?.length)project=legacy}}catch(e){}db.close();resolve()};get.onerror=()=>{db.close();resolve()}};req.onerror=()=>{try{const p=JSON.parse(localStorage.getItem('monn-studio-project'));if(p?.scenes?.length)project=p}catch(e){}resolve()}})}
function scene(id){return project.scenes.find(s=>s.id===id)}
function showLeft(tab){leftTab=tab;['Scenes','Chars','Assets','Quests','World','World3D'].forEach((v)=>$('tab'+v).classList.toggle('active',v.toLowerCase()===tab));renderLeft()}
function renderLeft(){const root=$('leftContent');if(leftTab==='scenes'){root.innerHTML='<div class="field"><label>نام بازی</label><input value="'+esc(project.meta.title||'')+'" onchange="project.meta.title=this.value;persist()"></div><div class="muted">هر کارت یک بخش از بازی است. روی کارت بزن تا ویرایش شود.</div><div class="scene-list">'+project.scenes.map(s=>'<button class="scene-item '+(s.id===active?'active':'')+'" onclick="selectScene(\''+esc(s.id)+'\')"><span><b>'+esc(s.title||s.id)+'</b><small>'+esc(s.id)+' · '+(s.choices||[]).length+' مسیر</small></span><span>◇</span></button>').join('')+'</div>';}else if(leftTab==='chars'){root.innerHTML='<button class="primary" onclick="addCharacter()">＋ افزودن شخصیت</button><p class="muted">شخصیت‌ها را تعریف کن و در دیالوگ صحنه‌ها به کار ببر.</p>'+project.characters.map((c,i)=>'<div class="character-card"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.id)+'</div><button onclick="editCharacter('+i+')">ویرایش</button> <button onclick="useAssetCharacter('+i+')">تصویر از دارایی‌ها</button> <button class="danger" onclick="removeCharacter('+i+')">حذف</button></div>').join('');}else if(leftTab==='quests'){root.innerHTML='<button class="primary" onclick="addQuest()">＋ تعریف مأموریت</button><p class="muted">مأموریت‌ها را بساز و در شرط‌ها و اثرهای انتخاب به کار ببر.</p>'+project.quests.map((q,i)=>'<div class="character-card"><b>'+esc(q.title||q.id)+'</b><div class="muted">'+esc(q.id)+'</div><button onclick="editQuest('+i+')">ویرایش</button> <button class="danger" onclick="removeQuest('+i+')">حذف</button></div>').join('')||'<div class="empty">هنوز مأموریتی تعریف نشده است.</div>';}else if(leftTab==='world'){renderWorldEditor(root);return;}else if(leftTab==='world3d'){renderWorld3DEditor(root);return;}else{root.innerHTML='<button class="primary" onclick="$(\'assetFile\').click()">＋ واردکردن تصویر / صدا / ویدیو / مدل</button><p class="muted">دارایی‌ها داخل فایل پروژهٔ MONN جاسازی می‌شوند؛ برای خروجی مستقل نیاز به پوشهٔ جداگانه ندارند.</p>'+((project.assets||[]).map((a,i)=>'<div class="asset-card">'+(a.kind==='image'?'<img src="'+a.data+'" style="width:100%;max-height:90px;object-fit:cover;border-radius:7px">':a.kind==='video'?'<video src="'+a.data+'" controls muted style="width:100%;max-height:90px"></video>':a.kind==='model'?'◇ 3D':'♫ ')+esc(a.name)+'<div class="muted">'+a.kind+' · پدیدآورنده: '+esc(a.author||'ثبت نشده')+' · مجوز: '+esc(a.license||'ثبت نشده')+'</div><button onclick="editAssetCredit('+i+')">ثبت منبع و مجوز</button> <button onclick="useAssetAsPlayer('+i+')">تنظیم برای بازیکن 2D</button> <button onclick="useAsset('+i+')">استفاده در صحنه</button> <button onclick="useAssetInWorld('+i+')">استفاده در نقشه 2D</button> <button onclick="useAssetAsWorldBackground('+i+')">پس‌زمینه نقشه</button> <button class="danger" onclick="removeAsset('+i+')">حذف</button></div>').join('')||'<div class="empty">هنوز فایلی وارد نشده است.</div>')}}
function render(){ensureProjectShape();renderLeft();renderGraph();renderInspector();persist()}
function renderGraph(){const canvas=$('canvas'),old=[...canvas.querySelectorAll('.node')];old.forEach(n=>n.remove());const svg=$('wires');svg.innerHTML='';project.scenes.forEach((s,i)=>{if(!s.pos)s.pos={x:90+(i%4)*300,y:90+Math.floor(i/4)*230};const n=document.createElement('div');n.className='node '+(s.id===active?'selected ':'')+(s.id===project.meta.start_scene?'node-start ':'')+(!(s.choices||[]).length?'node-end':'');n.style.left=s.pos.x+'px';n.style.top=s.pos.y+'px';n.dataset.id=s.id;n.innerHTML='<div class="node-title"><span>'+esc(s.title||s.id)+'</span><small>'+esc(s.id)+'</small></div><div class="node-body">'+esc((s.text||'متن صحنه خالی است').slice(0,90))+'<br>↗ '+(s.choices||[]).length+' انتخاب</div><div class="node-port" title="اتصال به صحنه دیگر"></div>';n.addEventListener('pointerdown',e=>{if(connect&&connect.from!==s.id){const src=scene(connect.from);const c=(src.choices||[]).find(x=>x.id===connect.choice);if(c){c.target=s.id;toast('مسیر داستان وصل شد')}connect=null;render();e.preventDefault();return}if(e.target.classList.contains('node-port')){toast('برای اتصال، از دکمه «اتصال روی نقشه» در انتخاب استفاده کن');e.preventDefault();return}selectScene(s.id);drag={id:s.id,x:e.clientX,y:e.clientY,ox:s.pos.x,oy:s.pos.y};n.setPointerCapture(e.pointerId)});n.addEventListener('pointermove',e=>{if(!drag||drag.id!==s.id)return;s.pos.x=Math.max(0,drag.ox+e.clientX-drag.x);s.pos.y=Math.max(0,drag.oy+e.clientY-drag.y);n.style.left=s.pos.x+'px';n.style.top=s.pos.y+'px';drawWires()});n.addEventListener('pointerup',e=>{if(drag?.id===s.id){drag=null;persist()}});n.addEventListener('click',e=>{if(connect&&connect.from!==s.id){const src=scene(connect.from);const c=(src.choices||[]).find(x=>x.id===connect.choice);if(c){c.target=s.id;toast('مسیر داستان وصل شد')}connect=null;render()} });canvas.append(n)});drawWires()}
function drawWires(){const svg=$('wires');svg.innerHTML='';project.scenes.forEach(s=>(s.choices||[]).forEach(c=>{const t=scene(c.target);if(!t)return;const x1=s.pos.x+210,y1=s.pos.y+60+(s.choices.indexOf(c)*12),x2=t.pos.x,y2=t.pos.y+55;const dx=Math.max(45,(x2-x1)*.5);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);p.setAttribute('class','wire');svg.append(p)}))}
function selectScene(id){active=id;renderLeft();document.querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.id===id));renderInspector()}
function field(label,key,value,type='text'){return '<div class="field"><label>'+label+'</label><input data-key="'+key+'" value="'+esc(value)+'" type="'+type+'"></div>'}
function renderInspector(){const s=scene(active);$('inspectId').textContent=s?.id||'—';if(!s){$('inspector').innerHTML='<div class="empty">صحنه انتخاب نشده است.</div>';return}
$('inspector').innerHTML=field('شناسه یکتا','id',s.id)+field('عنوان صحنه','title',s.title)+ '<div class="field"><label>روایت و توضیحات صحنه</label><textarea data-key="text">'+esc(s.text)+'</textarea></div>'+field('تصویر پس‌زمینه (دارایی یا نشانی امن)','image',s.image||'')+field('موسیقی پس‌زمینه','music',s.music||'')+field('ویدیوی صحنه (MP4/WebM)','video',s.video||'')+field('مدل سه‌بعدی صحنه (GLB/GLTF)','model',s.model||'')+field('صدای دکمه‌های این صحنه','button_sound',s.button_sound||'')+field('شروع کلیپ ویدیو (ثانیه)','video_start',s.video_start??0,'number')+field('پایان کلیپ ویدیو (ثانیه؛ صفر=تا انتها)','video_end',s.video_end??0,'number')+'<div class="section-title">گفت‌وگو و دیالوگ شخصیت‌ها</div><div id="dialogues">'+(s.dialogue||[]).map((line,i)=>dialogueEditor(line,i)).join('')+'</div><button onclick="addDialogue()">＋ افزودن دیالوگ</button><div class="section-title">انتخاب‌ها و مسیرهای داستان</div><div id="choices">'+(s.choices||[]).map((c,i)=>choiceEditor(c,i)).join('')+'</div><button class="primary" onclick="addChoice()">＋ افزودن انتخاب</button><div class="section-title">مدیریت صحنه</div><div class="row"><button onclick="duplicateScene()">تکثیر</button><button class="danger" onclick="deleteScene()">حذف صحنه</button></div><div class="field"><label><input id="isStart" type="checkbox" style="width:auto" '+(project.meta.start_scene===s.id?'checked':'')+' onchange="setStart()"> این صحنه، شروع بازی باشد</label></div>';
$('inspector').querySelectorAll('[data-key]').forEach(el=>el.addEventListener('change',()=>{const key=el.dataset.key;s[key]=['video_start','video_end'].includes(key)?(Number(el.value)||0):(['image','music','video','model','button_sound'].includes(key)?(el.value||null):el.value);if(el.dataset.key==='id'){const old=active,newId=el.value.trim();if(!newId||project.scenes.some(x=>x!==s&&x.id===newId)){toast('شناسه خالی یا تکراری است');el.value=old;return}project.scenes.forEach(x=>(x.choices||[]).forEach(c=>{if(c.target===old)c.target=newId}));if(project.meta.start_scene===old)project.meta.start_scene=newId;active=newId}render()}))}
function choiceEditor(c,i){return '<div class="choice-card"><div class="field"><label>متن انتخاب</label><input value="'+esc(c.text)+'" onchange="editChoice('+i+',\'text\',this.value)"></div><div class="field"><label>مقصد مسیر</label><select onchange="editChoice('+i+',\'target\',this.value)"><option value="">پایان بازی</option>'+project.scenes.map(x=>'<option value="'+esc(x.id)+'" '+(c.target===x.id?'selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select></div><div class="row"><button onclick="editLogic('+i+')">شرط و اثر</button><button class="danger" onclick="removeChoice('+i+')">حذف</button></div><div class="field"><label>صدای اختصاصی انتخاب</label><input value="'+esc(c.sound||'')+'" onchange="editChoice('+i+',\'sound\',this.value)"></div><button style="margin-top:7px" onclick="beginConnect('+i+')">اتصال روی نقشه</button></div>'}
function dialogueEditor(line,i){const ch=project.characters.find(c=>c.id===line.character)||{};return '<div class="choice-card"><div class="field"><label>شخصیت</label><select onchange="editDialogue('+i+',\'character\',this.value)"><option value="">راوی</option>'+project.characters.map(c=>'<option value="'+esc(c.id)+'" '+(line.character===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label>متن دیالوگ</label><textarea onchange="editDialogue('+i+',\'text\',this.value)">'+esc(line.text||'')+'</textarea></div><div class="field"><label>حالت چهره / انیمیشن</label><select onchange="editDialogue('+i+',\'expression\',this.value)"><option value="">پیش‌فرض</option>'+Object.keys(ch.expressions||{}).map(x=>'<option '+(line.expression===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div><div class="row"><div class="field"><label>ویدیوی اختصاصی این دیالوگ</label><input value="'+esc(line.video||'')+'" onchange="editDialogue('+i+',\'video\',this.value)"></div><div class="field"><label>شروع کلیپ (ثانیه)</label><input type="number" value="'+Number(line.video_start||0)+'" onchange="editDialogue('+i+',\'video_start\',this.value)"></div><div class="field"><label>پایان کلیپ (ثانیه)</label><input type="number" value="'+Number(line.video_end||0)+'" onchange="editDialogue('+i+',\'video_end\',this.value)"></div><div class="field"><label>صدای دیالوگ</label><input value="'+esc(line.voice||'')+'" onchange="editDialogue('+i+',\'voice\',this.value)"></div></div><button class="danger" onclick="removeDialogue('+i+')">حذف دیالوگ</button></div>'}
function addDialogue(){scene(active).dialogue=scene(active).dialogue||[];scene(active).dialogue.push({character:project.characters[0]?.id||null,text:'متن دیالوگ...'});renderInspector();persist()}
function editDialogue(i,k,v){scene(active).dialogue[i][k]=(k==='character'&&!v)?null:(['video_start','video_end'].includes(k)?(Number(v)||0):v);persist()}
function removeDialogue(i){scene(active).dialogue.splice(i,1);renderInspector();persist()}
function editChoice(i,k,v){scene(active).choices[i][k]=v||null;renderGraph();persist()}
function addChoice(){scene(active).choices.push({id:'choice_'+Date.now(),text:'انتخاب جدید',target:null,conditions:[],effects:[]});renderInspector();renderGraph();persist()}
function removeChoice(i){scene(active).choices.splice(i,1);renderInspector();renderGraph();persist()}
function beginConnect(i){connect={from:active,choice:scene(active).choices[i].id};toast('اکنون روی کارت صحنهٔ مقصد کلیک کن.')}
function editLogic(i){logicChoiceIndex=i;const c=scene(active).choices[i];logicConditions=JSON.parse(JSON.stringify(c.conditions||[]));logicEffects=JSON.parse(JSON.stringify(c.effects||[]));renderLogicEditor()}
function addScene(){let id='scene_'+(project.scenes.length+1);while(scene(id))id+='_';project.scenes.push({id,title:'صحنه جدید',text:'روایت این بخش را بنویس...',choices:[],pos:{x:130+Math.random()*300,y:120+Math.random()*400}});active=id;render()}
function deleteScene(){if(project.scenes.length===1){toast('پروژه باید حداقل یک صحنه داشته باشد');return}if(!confirm('این صحنه و مسیرهای ورودی آن حذف شود؟'))return;project.scenes=project.scenes.filter(s=>s.id!==active);project.scenes.forEach(s=>(s.choices||[]).forEach(c=>{if(c.target===active)c.target=null}));if(project.meta.start_scene===active)project.meta.start_scene=project.scenes[0].id;active=project.meta.start_scene;render()}
function duplicateScene(){const s=scene(active),copy=JSON.parse(JSON.stringify(s));copy.id=s.id+'_copy';let n=2;while(scene(copy.id))copy.id=s.id+'_copy'+n++;copy.title+=' (کپی)';copy.pos={x:s.pos.x+50,y:s.pos.y+50};project.scenes.push(copy);active=copy.id;render()}
function setStart(){project.meta.start_scene=active;renderGraph();persist()}
function autoLayout(){project.scenes.forEach((s,i)=>s.pos={x:70+(i%4)*320,y:70+Math.floor(i/4)*250});renderGraph();persist()}
function fitCanvas(){$('canvasWrap').scrollTo({left:0,top:0,behavior:'smooth'})}
function addQuest(){const id='quest_'+(project.quests.length+1);project.quests.push({id,title:'مأموریت تازه'});renderLeft();persist()}
function editQuest(i){const q=project.quests[i],title=prompt('عنوان مأموریت',q.title||q.id);if(title===null)return;q.title=title;persist();renderLeft()}
function removeQuest(i){const id=project.quests[i].id;if(!confirm('مأموریت حذف شود؟'))return;project.scenes.forEach(s=>(s.choices||[]).forEach(c=>{c.conditions=(c.conditions||[]).filter(x=>!(x.type==='quest'&&(x.name===id||x.id===id)));c.effects=(c.effects||[]).filter(x=>!(x.type==='quest'&&(x.name===id||x.id===id)))}));project.quests.splice(i,1);renderLeft();persist()}
function addCharacter(){project.characters.push({id:'character_'+(project.characters.length+1),name:'شخصیت تازه'});renderLeft();persist()}
function editCharacter(i){openCharacterEditor(i)}
function useAssetCharacter(i){const assets=(project.assets||[]).filter(a=>['image','video','model','audio'].includes(a.kind));if(!assets.length){toast('ابتدا یک دارایی وارد کن');return}const card=$('modal').querySelector('.modal-card');card.innerHTML='<div class="panel-head">انتخاب رسانه شخصیت <button onclick="closePreview()">بستن</button></div>'+assets.map((a,n)=>'<button style="display:block;width:100%;margin:7px 0;text-align:right" onclick="assignCharacterAsset('+i+','+n+')">'+esc(a.name)+' · '+a.kind+'</button>').join('');$('modal').classList.add('open')}
function assignCharacterAsset(i,n){const a=project.assets[n],c=project.characters[i];if(a.kind==='image')c.portrait=a.data;else if(a.kind==='video')c.video=a.data;else if(a.kind==='model')c.model=a.data;else c.voice=a.data;closePreview();persist();renderLeft();toast('رسانه به شخصیت افزوده شد')}
function removeCharacter(i){const id=project.characters[i].id;project.scenes.forEach(s=>(s.dialogue||[]).forEach(line=>{if(line.character===id)line.character=null}));project.characters.splice(i,1);renderLeft();persist()}
function readAsset(e){const f=e.target.files[0];if(!f)return;if(f.size>32*1024*1024){toast('حجم هر دارایی حداکثر ۳۲ مگابایت باشد');return}const r=new FileReader();r.onload=()=>{project.assets=project.assets||[];project.assets.push({name:f.name,kind:f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':(f.name.toLowerCase().endsWith('.glb')||f.name.toLowerCase().endsWith('.gltf')||f.type.includes('model'))?'model':'audio',data:r.result,author:'',source:'',license:''});toast('دارایی به پروژه اضافه شد');renderLeft();persist()};r.readAsDataURL(f);e.target.value=''}
function useAsset(i){const a=project.assets[i],s=scene(active);if(!s)return;if(a.kind==='image')s.image=a.data;else if(a.kind==='video')s.video=a.data;else if(a.kind==='model')s.model=a.data;else s.music=a.data;renderInspector();toast('دارایی به صحنه فعال اضافه شد');persist()}
function useAssetAsWorldBackground(i){ensureProjectShape();const a=project.assets[i];if(a.kind!=='image'){toast('پس‌زمینه نقشه باید تصویر باشد');return}project.world.background=a.data;persist();toast('پس‌زمینه نقشه تنظیم شد')}
function useAssetAsPlayer(i){ensureProjectShape();const a=project.assets[i];if(a.kind==='image')project.world.player.image=a.data;else if(a.kind==='model')project.world.player.model=a.data;else{toast('برای بازیکن تصویر یا مدل انتخاب کن');return}persist();toast('رسانه بازیکن 2D تنظیم شد')}
function useAssetInWorld(i){ensureProjectShape();const a=project.assets[i];if(selectedWorldSprite){const sp=project.world.sprites.find(x=>x.id===selectedWorldSprite);if(sp){if(a.kind==='image')sp.image=a.data;else if(a.kind==='model')sp.model=a.data;else{toast('برای اشیای نقشه تصویر یا مدل انتخاب کن');return}}}else if(a.kind==='image')project.world.player.image=a.data;else if(a.kind==='model')project.world.player.model=a.data;else{toast('برای بازیکن تصویر یا مدل انتخاب کن');return}persist();toast('دارایی به جهان دوبعدی افزوده شد')}
function editAssetCredit(i){const a=project.assets[i],card=$('modal').querySelector('.modal-card');card.innerHTML='<div class="panel-head">اطلاعات مالکیت و منبع دارایی <button onclick="closePreview()">بستن</button></div><div class="field"><label>نام پدیدآورنده / صاحب اثر</label><input id="assetAuthor" value="'+esc(a.author||'')+'"></div><div class="field"><label>نشانی منبع اصلی</label><input id="assetSource" value="'+esc(a.source||'')+'"></div><div class="field"><label>مجوز استفاده (مثلاً CC BY 4.0، MIT، مجوز اختصاصی)</label><input id="assetLicense" value="'+esc(a.license||'')+'"></div><div class="field"><label>یادداشت و شرایط ذکر نام</label><textarea id="assetNotes">'+esc(a.notes||'')+'</textarea></div><button class="primary" onclick="saveAssetCredit('+i+')">ذخیره اطلاعات</button>';$('modal').classList.add('open')}
function saveAssetCredit(i){const a=project.assets[i];a.author=$('assetAuthor').value.trim();a.source=$('assetSource').value.trim();a.license=$('assetLicense').value.trim();a.notes=$('assetNotes').value;closePreview();persist();renderLeft();toast('اطلاعات منبع ذخیره شد')}
function removeAsset(i){project.assets.splice(i,1);renderLeft();persist()}
function newProject(){if(!confirm('پروژه فعلی با یک پروژه تازه جایگزین شود؟'))return;project=fresh();active='start';render()}
function openProject(){$('projectFile').click()}
function readProject(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=async()=>{try{if(f.name.toLowerCase().endsWith('.monn')){const res=await fetch('/api/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:reader.result})});const data=await res.json();if(!res.ok)throw Error(data.error||'فایل MONN نامعتبر است');project=data}else project=JSON.parse(reader.result);ensureProjectShape();active=project.meta.start_scene;render();toast('پروژه MONN بارگذاری شد')}catch(err){toast('خطا: '+err.message)}};reader.readAsText(f);e.target.value=''}
async function saveMonn(){try{const res=await fetch('/api/source',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(project)});if(!res.ok){const err=await res.json();throw Error(err.error||'ساخت منبع MONN ناموفق بود')}const blob=await res.blob();download(blob,(project.meta.id||'game')+'.monn');toast('فایل بومی MONN ذخیره شد')}catch(err){toast('خطا در ذخیره MONN: '+err.message)}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function buildGame(){try{const res=await fetch('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(project)});if(!res.ok){const e=await res.json();throw Error(e.error||'ساخت بازی ناموفق بود')}const blob=await res.blob();download(blob,(project.meta.id||'monn-game')+'.html');toast('بازی وب ساخته شد! فایل HTML آماده انتشار است.')}catch(e){toast('خطا در ساخت: '+e.message)}}
async function preview(){try{const res=await fetch('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(project)});if(!res.ok){const e=await res.json();throw Error(e.error||'پیش‌نمایش ناموفق بود')}const html=await res.text();const card=$('modal').querySelector('.modal-card');card.style.width='min(1200px,100%)';card.innerHTML='<div class="panel-head">پیش‌نمایش بازی <button onclick="closePreview()">بستن</button></div><iframe class="preview" id="preview"></iframe>';$('modal').classList.add('open');$('preview').srcdoc=html;toast('پیش‌نمایش زنده آماده شد؛ تغییرات بعدی با اجرای دوباره پیش‌نمایش اعمال می‌شود.')}catch(e){toast('خطا در پیش‌نمایش: '+e.message)}}
function closePreview(){$('modal').classList.remove('open')}
let nitroProposal=null;
const authToken=()=>localStorage.getItem('monn-auth-token')||'';
async function apiJSON(path,data,auth=true){const headers={'Content-Type':'application/json'};if(auth&&authToken())headers.Authorization='Bearer '+authToken();const response=await fetch(path,{method:'POST',headers,body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error||'درخواست ناموفق بود');return result}
function openAccount(){const card=$('modal').querySelector('.modal-card');card.style.width='min(520px,100%)';card.innerHTML='<div class="panel-head">حساب محلی Monn <button onclick="closePreview()">بستن</button></div><p class="muted">حساب روی همین رایانه ذخیره می‌شود؛ فعلاً همگام‌سازی ابری یا ورود اینترنتی وجود ندارد.</p><div class="field"><label>نام کاربری (۳ تا ۳۲ نویسه انگلیسی)</label><input id="authUser" autocomplete="username" placeholder="نام کاربری"></div><div class="field"><label>گذرواژه (حداقل ۱۰ نویسه)</label><input id="authPass" type="password" autocomplete="current-password" placeholder="گذرواژه"></div><div class="row"><button class="primary" onclick="accountAction(\'login\')">ورود</button><button onclick="accountAction(\'register\')">ساخت حساب</button></div><button class="danger" style="margin-top:12px" onclick="accountLogout()">خروج از حساب</button><p class="muted" id="authStatus"></p>';$('modal').classList.add('open');}
async function accountAction(action){try{const r=await apiJSON('/api/auth/'+action,{username:$('authUser').value,password:$('authPass').value},false);localStorage.setItem('monn-auth-token',r.token);$('authStatus').textContent='وارد شدی: '+r.username;toast('حساب محلی آماده است.')}catch(e){$('authStatus').textContent=e.message}}
async function accountLogout(){try{await apiJSON('/api/auth/logout',{},true)}catch(e){}localStorage.removeItem('monn-auth-token');$('authStatus').textContent='از حساب خارج شدی.';toast('خروج انجام شد.')}
function openNitro(){const card=$('modal').querySelector('.modal-card');card.style.width='min(760px,100%)';card.innerHTML='<div class="panel-head">✦ نیترو؛ دستیار هوشمند بازی‌سازی <button onclick="closePreview()">بستن</button></div><p class="muted">حالت محلی و خصوصی: نیترو از Ollama روی همین رایانه استفاده می‌کند. ابتدا حساب محلی بساز یا وارد شو. نصب Ollama و دریافت یک مدل زبانی لازم است.</p><div class="row"><div class="field"><label>مدل محلی</label><input id="nitroModel" value="qwen2.5:7b"></div><div class="field"><label>نشانی Ollama</label><input id="nitroEndpoint" value="http://127.0.0.1:11434/api/chat"></div></div><div class="field"><label>درخواستت از نیترو</label><textarea id="nitroPrompt" rows="4" placeholder="مثلاً یک مرحله مخفی در جنگل بساز، با دو انتخاب و یک شخصیت راهنما..."></textarea></div><div class="row"><button class="primary" onclick="askNitro()">ساخت پیشنهاد</button><button onclick="openAccount()">حساب کاربری</button></div><div id="nitroResult" class="choice-card" style="display:none"></div><p class="muted">نیترو هیچ تغییری را خودکار اعمال نمی‌کند. ابتدا عملیات و نتیجه را بررسی کن و سپس «تأیید و اعمال» را بزن. اجرای کد دلخواه توسط نیترو مسدود است.</p>';$('modal').classList.add('open');}
async function askNitro(){const out=$('nitroResult');out.style.display='block';out.textContent='نیترو در حال بررسی پروژه است...';nitroProposal=null;try{const r=await apiJSON('/api/nitro/propose',{project,prompt:$('nitroPrompt').value,endpoint:$('nitroEndpoint').value,model:$('nitroModel').value});nitroProposal=r.id;out.innerHTML='<b>پیشنهاد نیترو</b><p>'+esc(r.summary)+'</p><pre style="white-space:pre-wrap;direction:ltr;text-align:left;max-height:240px;overflow:auto">'+esc(JSON.stringify(r.operations,null,2))+'</pre><p class="muted">تغییرها اعتبارسنجی شدند؛ هنوز روی پروژه اعمال نشده‌اند.</p><button class="primary" onclick="approveNitro()">تأیید و اعمال تغییرها</button> <button onclick="nitroProposal=null;this.parentElement.innerHTML=\'پیشنهاد رد شد.\'">رد پیشنهاد</button>';}catch(e){out.textContent=e.message}}
async function approveNitro(){if(!nitroProposal)return;try{const r=await apiJSON('/api/nitro/approve',{id:nitroProposal,project});project=r.project;nitroProposal=null;ensureProjectShape();render();persist();$('nitroResult').textContent='تغییرها با تأیید تو اعمال شدند.';toast('نیترو تغییرها را اعمال کرد.')}catch(e){$('nitroResult').textContent=e.message}}


let logicChoiceIndex=null, logicConditions=[], logicEffects=[], editingCharacterIndex=null, selectedWorldSprite=null, spriteDrag=null;
function ensureProjectShape(){project.ui=project.ui||{menu_enabled:true,start_label:'شروع بازی',settings_label:'تنظیمات',show_health:true,show_inventory:true,show_quests:true,elements:[]};project.ui.elements=project.ui.elements||[];project.world=project.world||{enabled:false,width:800,height:450,sprites:[],player:{x:40,y:40,width:28,height:40,speed:3,color:'#42d7e8'}};project.world.sprites=project.world.sprites||[];project.characters=project.characters||[];project.quests=project.quests||[];project.assets=project.assets||[]}

// ── Timeline editor: visual tracks for scene media and keyframe-like animations ──
let timelineDrag=null, timelineSelected=null, uiDesignerSelected=null, uiDesignerDrag=null;
function ensureTimeline(s){s.timeline=s.timeline||{duration:15,fps:30,tracks:[{id:'video',name:'ویدیو',type:'video',clips:[]},{id:'audio',name:'صدا',type:'audio',clips:[]},{id:'animation',name:'انیمیشن',type:'animation',clips:[]}]};s.timeline.tracks=s.timeline.tracks||[];['video','audio','animation'].forEach(type=>{if(!s.timeline.tracks.some(t=>t.type===type))s.timeline.tracks.push({id:type,name:{video:'ویدیو',audio:'صدا',animation:'انیمیشن'}[type],type,clips:[]})});s.timeline.duration=Number(s.timeline.duration)||15;s.timeline.fps=Number(s.timeline.fps)||30}
function openTimelineEditor(){const s=scene(active);ensureTimeline(s);renderTimelineEditor()}
function renderTimelineEditor(){const s=scene(active),tl=s.timeline,card=$('modal').querySelector('.modal-card');const scale=700/tl.duration;let html='<div class="panel-head">تایم‌لاین صحنه: '+esc(s.title)+' <button onclick="closePreview()">بستن</button></div><p class="muted">کلیپ‌ها را روی لایهٔ مربوط قرار بده. زمان‌ها بر حسب ثانیه هستند؛ برای جابه‌جایی، کلیپ را افقی بکش.</p><div class="row"><div class="field"><label>مدت صحنه (ثانیه)</label><input id="tlDuration" type="number" min="1" max="3600" value="'+tl.duration+'"></div><div class="field"><label>نرخ فریم</label><select id="tlFps"><option '+(tl.fps===24?'selected':'')+'>24</option><option '+(tl.fps===30?'selected':'')+'>30</option><option '+(tl.fps===60?'selected':'')+'>60</option></select></div></div><div class="timeline-toolbar"><button onclick="addTimelineClip(\'video\')">＋ کلیپ ویدیو</button><button onclick="addTimelineClip(\'audio\')">＋ کلیپ صدا</button><button onclick="addTimelineClip(\'animation\')">＋ انیمیشن</button></div><div class="timeline-ruler"><div>لایه / زمان</div><div>'+Array.from({length:11},(_,i)=>'<span>'+((tl.duration*i/10).toFixed(1))+'s</span>').join('')+'</div></div>';
tl.tracks.forEach(track=>{html+='<div class="timeline-track"><div class="timeline-track-name">'+esc(track.name)+'</div><div class="timeline-lane" data-track="'+esc(track.id)+'" style="height:58px">';track.clips.forEach((c,i)=>{const left=Math.max(0,Number(c.start)||0)/tl.duration*100,width=Math.max(4,Number(c.duration)||1)/tl.duration*100;html+='<div class="timeline-clip '+track.type+'" data-track="'+esc(track.id)+'" data-index="'+i+'" style="left:'+left+'%;width:'+Math.min(100-left,width)+'%">'+esc(c.name||c.type||track.type)+'</div>'});html+='</div></div>'});
html+='<div class="timeline-inspector" id="timelineInspector"><span class="muted">برای ویرایش جزئیات، روی یک کلیپ بزن.</span></div><div style="margin-top:14px"><button class="primary" onclick="saveTimelineEditor()">ذخیره تایم‌لاین</button></div>';
card.innerHTML=html;$('modal').classList.add('open');$('modal').querySelector('.modal-card').style.width='min(1100px,100%)';
card.querySelectorAll('.timeline-clip').forEach(el=>{el.addEventListener('click',()=>selectTimelineClip(el.dataset.track,Number(el.dataset.index)));el.addEventListener('pointerdown',e=>{if(e.target!==el)return;timelineDrag={track:el.dataset.track,index:Number(el.dataset.index),x:e.clientX,start:scene(active).timeline.tracks.find(t=>t.id===el.dataset.track).clips[Number(el.dataset.index)].start||0};el.setPointerCapture(e.pointerId)}) ;el.addEventListener('pointermove',e=>{if(!timelineDrag||timelineDrag.track!==el.dataset.track||timelineDrag.index!==Number(el.dataset.index))return;const lane=el.parentElement.getBoundingClientRect(),seconds=(e.clientX-timelineDrag.x)/lane.width*scene(active).timeline.duration;const clip=scene(active).timeline.tracks.find(t=>t.id===timelineDrag.track).clips[timelineDrag.index];clip.start=Math.max(0,Math.min(scene(active).timeline.duration-0.1,timelineDrag.start+seconds));el.style.left=(clip.start/scene(active).timeline.duration*100)+'%' });el.addEventListener('pointerup',()=>{if(timelineDrag){timelineDrag=null;persist()}})})}
function addTimelineClip(type){const s=scene(active);ensureTimeline(s);const t=s.timeline.tracks.find(x=>x.type===type);t.clips.push({id:'clip_'+Date.now(),type,name:type==='video'?'ویدیوی تازه':type==='audio'?'صدای تازه':'حرکت تازه',src:'',start:0,duration:3,in:0,out:0,target:'',property:'opacity',from:0,to:1});renderTimelineEditor();selectTimelineClip(t.id,t.clips.length-1)}
function selectTimelineClip(trackId,index){timelineSelected={trackId,index};const t=scene(active).timeline.tracks.find(x=>x.id===trackId),c=t.clips[index];if(!c)return;const root=$('timelineInspector');root.innerHTML='<div class="field"><label>نام کلیپ</label><input id="tcName" value="'+esc(c.name||'')+'"></div><div class="field"><label>منبع فایل / مسیر دارایی</label><input id="tcSrc" value="'+esc(c.src||'')+'"></div><div class="field"><label>شروع روی تایم‌لاین</label><input id="tcStart" type="number" step=".1" value="'+Number(c.start||0)+'"></div><div class="field"><label>مدت اجرا</label><input id="tcDuration" type="number" min=".1" step=".1" value="'+Number(c.duration||1)+'"></div><div class="field"><label>نقطه ورود فایل (ثانیه)</label><input id="tcIn" type="number" min="0" step=".1" value="'+Number(c.in||0)+'"></div><div class="field"><label>نقطه خروج فایل (ثانیه؛ صفر=انتهای فایل)</label><input id="tcOut" type="number" min="0" step=".1" value="'+Number(c.out||0)+'"></div>'+(c.type==='animation'?'<div class="field"><label>شناسه عنصر رابط هدف</label><input id="tcTarget" value="'+esc(c.target||'')+'"></div><div class="field"><label>ویژگی متحرک</label><select id="tcProperty">'+['x','y','opacity','scale'].map(v=>'<option '+(c.property===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>از مقدار</label><input id="tcFrom" type="number" step=".1" value="'+Number(c.from||0)+'"></div><div class="field"><label>تا مقدار</label><input id="tcTo" type="number" step=".1" value="'+Number(c.to||1)+'"></div>':'')+'<button onclick="applyTimelineClip()">اعمال تغییرات</button> <button class="danger" onclick="deleteTimelineClip()">حذف کلیپ</button>'}
function applyTimelineClip(){if(!timelineSelected)return;const t=scene(active).timeline.tracks.find(x=>x.id===timelineSelected.trackId),c=t.clips[timelineSelected.index];c.name=$('tcName').value;c.src=$('tcSrc').value;c.start=Math.max(0,Number($('tcStart').value)||0);c.duration=Math.max(.1,Number($('tcDuration').value)||1);c.in=Math.max(0,Number($('tcIn').value)||0);c.out=Math.max(0,Number($('tcOut').value)||0);if(c.type==='animation'){c.target=$('tcTarget').value;c.property=$('tcProperty').value;c.from=Number($('tcFrom').value)||0;c.to=Number($('tcTo').value)||0}renderTimelineEditor();selectTimelineClip(t.id,timelineSelected.index);persist()}
function deleteTimelineClip(){if(!timelineSelected)return;const t=scene(active).timeline.tracks.find(x=>x.id===timelineSelected.trackId);t.clips.splice(timelineSelected.index,1);timelineSelected=null;renderTimelineEditor();persist()}
function saveTimelineEditor(){const s=scene(active);s.timeline.duration=Math.max(1,Math.min(3600,Number($('tlDuration').value)||15));s.timeline.fps=Number($('tlFps').value)||30;closePreview();persist();toast('تایم‌لاین در پروژه ذخیره شد')}
// ── Drag-and-drop UI designer ──
function openUIDesigner(){ensureProjectShape();project.ui.elements=project.ui.elements||[];renderUIDesigner()}
function renderUIDesigner(){project.ui.elements.forEach((el,i)=>{if(!el.id)el.id='ui_element_'+(i+1)});const card=$('modal').querySelector('.modal-card');card.innerHTML='<div class="panel-head">طراح کشیدنی رابط بازی <button onclick="closePreview()">بستن</button></div><p class="muted">عنصر را از ستون ابزار اضافه کن؛ سپس روی بوم بکش. اندازه و جایگاه دقیق از پنل ویژگی‌ها قابل تنظیم است.</p><div class="designer-layout"><div class="designer-tools"><b>عناصر آماده</b>'+[['text','متن'],['button','دکمه'],['name_input','ورود نام'],['location','مکان'],['image','تصویر'],['panel','پنل']].map(([t,n])=>'<button onclick="addDesignerElement(\''+t+'\')">＋ '+n+'</button>').join('')+'</div><div class="designer-canvas-wrap"><div class="designer-canvas" id="uiDesignCanvas">'+project.ui.elements.map((el,i)=>designerElementHTML(el,i)).join('')+'</div></div><div class="designer-inspector" id="uiDesignInspector"><span class="muted">یک عنصر را انتخاب کن.</span></div></div><div style="margin-top:12px"><button class="primary" onclick="saveUIDesigner()">ذخیره رابط</button></div>';$('modal').classList.add('open');$('modal').querySelector('.modal-card').style.width='min(1200px,100%)';wireDesignerItems();wireDesignerPalette()}
function wireDesignerPalette(){const palette=[...document.querySelectorAll('.designer-tools button')],canvas=$('uiDesignCanvas');palette.forEach(button=>{button.draggable=true;button.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',button.getAttribute('onclick').match(/'([^']+)'/)[1]);e.dataTransfer.effectAllowed='copy'})});canvas.addEventListener('dragover',e=>e.preventDefault());canvas.addEventListener('drop',e=>{e.preventDefault();const type=e.dataTransfer.getData('text/plain');if(!['text','button','name_input','location','image','panel'].includes(type))return;const rect=canvas.getBoundingClientRect();addDesignerElement(type);const el=project.ui.elements[project.ui.elements.length-1];el.x=Math.max(0,Math.min(95,(e.clientX-rect.left)/rect.width*100));el.y=Math.max(0,Math.min(95,(e.clientY-rect.top)/rect.height*100));renderUIDesigner();renderDesignerInspector();persist()})}
function designerElementHTML(el,i){const label=el.text||({button:'دکمه',name_input:'نام بازیکن',location:'مکان فعلی',image:'تصویر',panel:'پنل'}[el.type]||'متن'),content=el.type==='image'&&el.src?'<img src="'+esc(el.src)+'" alt="" style="width:100%;height:100%;object-fit:contain">':esc(label);return '<div class="designer-item '+(uiDesignerSelected===i?'selected':'')+'" data-index="'+i+'" style="left:'+Number(el.x||0)*7.2+'px;top:'+Number(el.y||0)*4.05+'px;width:'+Number(el.width||25)*7.2+'px;height:'+Number(el.height||12)*4.05+'px;background:'+(el.background||'#233a55')+';color:'+(el.color||'#ffffff')+';font-size:'+Number(el.font_size||14)+'px">'+content+'<span class="resize-handle"></span></div>'}
function wireDesignerItems(){const canvas=$('uiDesignCanvas');if(!canvas)return;canvas.querySelectorAll('.designer-item').forEach(el=>{el.addEventListener('pointerdown',e=>{const i=Number(el.dataset.index);uiDesignerSelected=i;const item=project.ui.elements[i],rect=canvas.getBoundingClientRect();uiDesignerDrag={i,x:e.clientX,y:e.clientY,ox:Number(item.x||0),oy:Number(item.y||0),resize:e.target.classList.contains('resize-handle'),ow:Number(item.width||25),oh:Number(item.height||12),rect};el.setPointerCapture(e.pointerId);renderDesignerInspector();e.preventDefault()});el.addEventListener('pointermove',e=>{if(!uiDesignerDrag||uiDesignerDrag.i!==Number(el.dataset.index))return;const d=uiDesignerDrag,item=project.ui.elements[d.i],dx=(e.clientX-d.x)/d.rect.width*100,dy=(e.clientY-d.y)/d.rect.height*100;if(d.resize){item.width=Math.max(5,Math.min(100,d.ow+dx));item.height=Math.max(5,Math.min(100,d.oh+dy))}else{item.x=Math.max(0,Math.min(95,d.ox+dx));item.y=Math.max(0,Math.min(95,d.oy+dy))}el.style.left=item.x*7.2+'px';el.style.top=item.y*4.05+'px';el.style.width=item.width*7.2+'px';el.style.height=item.height*4.05+'px'});el.addEventListener('pointerup',()=>{if(uiDesignerDrag){uiDesignerDrag=null;persist()}})})}
function addDesignerElement(type){const defaults={text:'متن تازه',button:'دکمه تازه',name_input:'نام بازیکن',location:'مکان فعلی',image:'تصویر',panel:'پنل'};project.ui.elements.push({id:'ui_element_'+Date.now(),type,text:defaults[type],x:10,y:10,width:25,height:12,color:'#ffffff',background:type==='text'?'#00000000':'#233a55',font_size:14});uiDesignerSelected=project.ui.elements.length-1;renderUIDesigner();renderDesignerInspector()}
function renderDesignerInspector(){const i=uiDesignerSelected,el=project.ui.elements[i],root=$('uiDesignInspector');if(!el){root.innerHTML='<span class="muted">یک عنصر را انتخاب کن.</span>';return}root.innerHTML='<b>ویژگی‌های عنصر '+(i+1)+'</b><div class="field"><label>متن / نام</label><input id="deText" value="'+esc(el.text||'')+'"></div><div class="field"><label>منبع تصویر</label><input id="deSrc" value="'+esc(el.src||'')+'"></div><div class="field"><label>مقصد دکمه</label><select id="deTarget"><option value="">بدون مقصد</option>'+project.scenes.map(s=>'<option value="'+esc(s.id)+'" '+(el.target===s.id?'selected':'')+'>'+esc(s.title)+'</option>').join('')+'</select></div>'+[['deX','جایگاه افقی (%)','x'],['deY','جایگاه عمودی (%)','y'],['deW','عرض (%)','width'],['deH','ارتفاع (%)','height'],['deFont','اندازه نوشته','font_size']].map(([id,label,key])=>'<div class="field"><label>'+label+'</label><input id="'+id+'" type="number" value="'+Number(el[key]??(key==='width'?25:key==='height'?12:key==='font_size'?14:0))+'"></div>').join('')+'<div class="field"><label>رنگ متن</label><input id="deColor" type="color" value="'+(el.color||'#ffffff')+'"></div><div class="field"><label>رنگ پس‌زمینه</label><input id="deBg" type="color" value="'+(el.background&&el.background.startsWith('#')&&el.background.length===7?el.background:'#233a55')+'"></div><button onclick="applyDesignerInspector()">اعمال</button> <button class="danger" onclick="removeDesignerElement()">حذف</button>'}
function applyDesignerInspector(){const el=project.ui.elements[uiDesignerSelected];el.text=$('deText').value;el.src=$('deSrc').value;el.target=$('deTarget').value||null;el.x=Number($('deX').value)||0;el.y=Number($('deY').value)||0;el.width=Number($('deW').value)||25;el.height=Number($('deH').value)||12;el.font_size=Number($('deFont').value)||14;el.color=$('deColor').value;el.background=$('deBg').value;renderUIDesigner();renderDesignerInspector();persist()}
function removeDesignerElement(){project.ui.elements.splice(uiDesignerSelected,1);uiDesignerSelected=null;renderUIDesigner();persist()}
function saveUIDesigner(){closePreview();persist();toast('چیدمان رابط در پروژه ذخیره شد')}

function openGameSettings(){ensureProjectShape();const ui=project.ui;const card=$('modal').querySelector('.modal-card');card.innerHTML='<div class="panel-head">طراحی رابط، منو و صفحه‌های بازی <button onclick="closePreview()">بستن</button></div><div class="help"><p class="muted">تنظیمات شروع، پایان، منو و اجزای رابط بازی را اینجا تعریف کن.</p><div class="row"><div class="field"><label>عنوان منو</label><input id="uiTitle" value="'+esc(ui.menu_title||project.meta.title)+'"></div><div class="field"><label>متن دکمه شروع</label><input id="uiStart" value="'+esc(ui.start_label||'شروع بازی')+'"></div></div><div class="row"><div class="field"><label>نام سازنده / صاحب پروژه</label><input id="projectAuthor" value="'+esc(project.meta.author||'')+'"></div><div class="field"><label>مجوز پروژه و کد (دارایی‌ها مجوز جدا دارند)</label><input id="projectLicense" value="'+esc(project.meta.license||'MIT')+'"></div></div><div class="row"><div class="field"><label>شناسه صحنه شروع</label><select id="uiStartScene">'+project.scenes.map(s=>'<option value="'+esc(s.id)+'" '+(project.meta.start_scene===s.id?'selected':'')+'>'+esc(s.title)+'</option>').join('')+'</select></div><div class="field"><label>صحنه پایان (اختیاری)</label><select id="uiEndScene"><option value="">پایان پیش‌فرض</option>'+project.scenes.map(s=>'<option value="'+esc(s.id)+'" '+(project.meta.ending_scene===s.id?'selected':'')+'>'+esc(s.title)+'</option>').join('')+'</select></div></div><div class="row"><div class="field"><label>تصویر پس‌زمینه منو</label><input id="uiMenuBg" value="'+esc(ui.menu_background||'')+'"></div><div class="field"><label>موسیقی منو</label><input id="uiMusic" value="'+esc(ui.background_music||'')+'"></div><div class="field"><label>صدای کلیک سراسری</label><input id="uiClick" value="'+esc(ui.button_sound||'')+'"></div></div><div class="row"><label><input id="uiMenuEnabled" type="checkbox" '+(ui.menu_enabled!==false?'checked':'')+' style="width:auto"> نمایش منوی آغاز</label><label><input id="uiHealth" type="checkbox" '+(ui.show_health!==false?'checked':'')+' style="width:auto"> نمایش جان</label><label><input id="uiInventory" type="checkbox" '+(ui.show_inventory!==false?'checked':'')+' style="width:auto"> نمایش کوله‌پشتی</label><label><input id="uiQuests" type="checkbox" '+(ui.show_quests!==false?'checked':'')+' style="width:auto"> نمایش مأموریت‌ها</label></div><div class="section-title">اجزای رابط سفارشی</div><div id="uiElements">'+ui.elements.map((el,i)=>uiElementEditor(el,i)).join('')+'</div><button onclick="addUIElement()">＋ افزودن عنصر رابط</button><div class="section-title">قواعد بازنشر و مالکیت</div><p>کدها، تصاویر، صداها، ویدیوها و مدل‌ها باید متعلق به سازنده باشند یا مجوز استفاده داشته باشند. هنگام کپی یا ویرایش محتوای دیگران، نام پدیدآورنده و منبع را حفظ و ذکر کن و شرایط مجوز اصلی را رعایت کن.</p><button class="primary" onclick="saveGameSettings()">ذخیره تنظیمات رابط</button></div>'; $('modal').classList.add('open')}
function uiElementEditor(el,i){return '<div class="choice-card"><div class="row"><div class="field"><label>نوع عنصر</label><select id="uieType'+i+'"><option value="text" '+(el.type==='text'?'selected':'')+'>متن</option><option value="button" '+(el.type==='button'?'selected':'')+'>دکمه</option><option value="name_input" '+(el.type==='name_input'?'selected':'')+'>کادر ورود نام</option><option value="location" '+(el.type==='location'?'selected':'')+'>نام مکان فعلی</option><option value="image" '+(el.type==='image'?'selected':'')+'>تصویر</option><option value="panel" '+(el.type==='panel'?'selected':'')+'>پنل</option></select></div><div class="field"><label>متن / برچسب</label><input id="uieText'+i+'" value="'+esc(el.text||'')+'"></div></div><div class="field"><label>مقصد دکمه (اختیاری)</label><select id="uieTarget'+i+'"><option value="">بدون مقصد</option>'+project.scenes.map(s=>'<option value="'+esc(s.id)+'" '+(el.target===s.id?'selected':'')+'>'+esc(s.title)+'</option>').join('')+'</select></div><div class="row"><div class="field"><label>موقعیت افقی (%)</label><input id="uieX'+i+'" type="number" value="'+Number(el.x||10)+'"></div><div class="field"><label>موقعیت عمودی (%)</label><input id="uieY'+i+'" type="number" value="'+Number(el.y||10)+'"></div><div class="field"><label>عرض (%)</label><input id="uieW'+i+'" type="number" value="'+Number(el.width||30)+'"></div></div><button class="danger" onclick="removeUIElement('+i+')">حذف عنصر</button></div>'}
function addUIElement(){project.ui.elements.push({type:'button',text:'دکمه تازه',x:10,y:10,width:30});openGameSettings()}

function update3DWeapon(key,value){world3D().weapon[key]=Number(value)||0;persist()}
function editWorldSprite(id,key,value){const s=project.world.sprites.find(x=>x.id===id);if(!s)return;if(key==='solid')s.solid=!!value;else if(['x','y','width','height','frames','fps','frame_width','frame_height'].includes(key))s[key]=Number(value)||0;else s[key]=value;persist();renderWorldEditor($('leftContent'))}
function renderWorldEditor(root){ensureProjectShape();const w=project.world;const selected=w.sprites.find(s=>s.id===selectedWorldSprite)||w.sprites[0];if(selected)selectedWorldSprite=selected.id;root.innerHTML='<p class="muted">نقشه دوبعدی؛ اشیا را روی صفحه بکش، اندازه بده و برخورد را روشن کن. کلیدهای جهت یا WASD بازیکن را در خروجی حرکت می‌دهند.</p><label><input id="worldEnabled" type="checkbox" '+(w.enabled?'checked':'')+' style="width:auto" onchange="project.world.enabled=this.checked;persist()"> فعال‌سازی جهان دوبعدی</label><div class="row"><div class="field"><label>عرض نقشه</label><input type="number" value="'+w.width+'" onchange="project.world.width=Number(this.value);renderLeft();persist()"></div><div class="field"><label>ارتفاع نقشه</label><input type="number" value="'+w.height+'" onchange="project.world.height=Number(this.value);renderLeft();persist()"></div></div><div class="field"><label>پس‌زمینه نقشه</label><input value="'+esc(w.background||'')+'" onchange="project.world.background=this.value||null;persist()"></div><div id="worldBoard" style="position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid #456;border-radius:10px;background-color:#152238;background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:24px 24px">'+w.sprites.map(s=>'<div data-world-id="'+esc(s.id)+'" onpointerdown="beginSpriteDrag(event,\''+esc(s.id)+'\')" onclick="selectWorldSprite(\''+esc(s.id)+'\')" style="position:absolute;left:'+(s.x/w.width*100)+'%;top:'+(s.y/w.height*100)+'%;width:'+(s.width/w.width*100)+'%;height:'+(s.height/w.height*100)+'%;background:'+(s.image?'transparent':(s.color||'#8a7cff'))+';background-image:'+(s.image?'url(&quot;'+esc(s.image)+'&quot;)':'none')+';background-size:cover;background-position:center;border:2px solid '+(s.solid?'#ff7187':'#42d7e8')+';border-radius:6px;display:grid;place-items:center;font-size:10px;overflow:hidden;cursor:move">'+esc(s.id)+'</div>').join('')+'</div><button class="primary" onclick="addWorldSprite()">＋ افزودن شیء به نقشه</button><div class="section-title">بازیکن</div>'+['x','y','width','height','speed'].map(k=>'<div class="field"><label>'+k+'</label><input type="number" value="'+Number((w.player||{})[k]??(k==='width'?28:k==='height'?40:k==='speed'?3:40))+'" onchange="project.world.player=project.world.player||{};project.world.player.'+k+'=Number(this.value);persist()"></div>').join('')+'<div class="row">'+['frames','fps','frame_width','frame_height'].map(k=>'<div class="field"><label>انیمیشن '+k+'</label><input type="number" value="'+Number((w.player||{})[k]||0)+'" onchange="project.world.player=project.world.player||{};project.world.player.'+k+'=Number(this.value);persist()"></div>').join('')+'</div><div class="section-title">اشیای نقشه</div>'+w.sprites.map(s=>'<div class="choice-card"><b>'+esc(s.id)+'</b><div class="row">'+['x','y','width','height'].map(k=>'<div class="field"><label>'+k+'</label><input type="number" value="'+Number(s[k]||0)+'" onchange="editWorldSprite(\''+esc(s.id)+'\',\''+k+'\',this.value)"></div>').join('')+'</div><label><input type="checkbox" style="width:auto" '+(s.solid?'checked':'')+' onchange="editWorldSprite(\''+esc(s.id)+'\',\'solid\',this.checked)"> برخورد فیزیکی (Solid)</label><div class="field"><label>تصویر / Sprite sheet</label><input value="'+esc(s.image||'')+'" onchange="editWorldSprite(\''+esc(s.id)+'\',\'image\',this.value)"></div><div class="row">'+['frames','fps','frame_width','frame_height'].map(k=>'<div class="field"><label>'+k+'</label><input type="number" value="'+Number(s[k]||0)+'" onchange="editWorldSprite(\''+esc(s.id)+'\',\''+k+'\',this.value)"></div>').join('')+'</div><button class="danger" onclick="project.world.sprites=project.world.sprites.filter(x=>x.id!==\''+esc(s.id)+'\');renderLeft();persist()">حذف شیء</button></div>').join('')||'<div class="empty">هنوز شیئی به نقشه اضافه نشده است.</div>'}
function beginSpriteDrag(e,id){spriteDrag={id,x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId);e.preventDefault()}
window.addEventListener('pointermove',e=>{if(!spriteDrag)return;const board=$('worldBoard');if(!board)return;const rect=board.getBoundingClientRect(),w=project.world.width,h=project.world.height,s=project.world.sprites.find(x=>x.id===spriteDrag.id);if(!s)return;s.x=Math.max(0,Math.min(w-s.width,(e.clientX-rect.left)/rect.width*w-s.width/2));s.y=Math.max(0,Math.min(h-s.height,(e.clientY-rect.top)/rect.height*h-s.height/2));const el=board.querySelector('[data-world-id="'+spriteDrag.id+'"]');if(el){el.style.left=s.x/w*100+'%';el.style.top=s.y/h*100+'%'}});
window.addEventListener('pointerup',()=>{if(spriteDrag){spriteDrag=null;persist()}});
function addConditionRow(){syncLogicEditorDraft();logicConditions.push({type:'stat',name:'سکه',op:'>=',value:1});renderLogicEditor()}
function addEffectRow(){syncLogicEditorDraft();logicEffects.push({type:'stat',name:'سکه',op:'add',value:1});renderLogicEditor()}
function syncLogicEditorDraft(){logicConditions=logicConditions.map((c,i)=>{const name=$('cn'+i),op=$('co'+i),value=$('cv'+i),type=$('ct'+i);if(!name||!op||!value||!type)return c;const t=type.value,raw=value.value;return {type:t,name:name.value.trim(),op:op.value,value:t==='flag'?raw==='true':t==='quest'?raw:Number(raw)}});logicEffects=logicEffects.map((c,i)=>{const name=$('en'+i),op=$('eo'+i),value=$('ev'+i),type=$('et'+i);if(!name||!value||!type)return c;const t=type.value,raw=value.value,operation=op?.value||'add';if(t==='journal')return {type:t,text:raw};if(t==='item')return {type:t,name:name.value.trim(),action:operation,count:Math.max(0,Number(raw)||1)};if(t==='quest')return {type:t,name:name.value.trim(),action:operation};if(t==='flag')return {type:t,name:name.value.trim(),value:raw==='true'};return {type:t,name:name.value.trim(),op:operation,value:Number(raw)||0}})}
function renderLogicEditor(){const card=$('modal').querySelector('.modal-card');const cond=logicConditions.map((c,i)=>'<div class="choice-card"><div class="row"><div class="field"><label>نوع شرط</label><select id="ct'+i+'" onchange="syncLogicEditorDraft();logicConditions['+i+'].type=this.value;renderLogicEditor()">'+['stat','health','item','flag','quest'].map(x=>'<option '+(c.type===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>نام / شناسه</label><input id="cn'+i+'" value="'+esc(c.name||'')+'"></div></div><div class="row"><div class="field"><label>عملگر</label><select id="co'+i+'">'+['==','!=','>','<','>=','<='].map(x=>'<option '+(c.op===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>مقدار</label><input id="cv'+i+'" value="'+esc(c.value??'')+'"></div></div><button class="danger" onclick="syncLogicEditorDraft();logicConditions.splice('+i+',1);renderLogicEditor()">حذف شرط</button></div>').join('');const eff=logicEffects.map((c,i)=>{const ops=c.type==='item'?['add','set','remove']:c.type==='quest'?['start','complete','fail']:c.type==='flag'?['set']:c.type==='journal'?[]:['add','set','subtract'];return '<div class="choice-card"><div class="row"><div class="field"><label>نوع اثر</label><select id="et'+i+'" onchange="syncLogicEditorDraft();logicEffects['+i+'].type=this.value;renderLogicEditor()">'+['stat','health','item','flag','quest','journal'].map(x=>'<option '+(c.type===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>نام / شناسه</label><input id="en'+i+'" value="'+esc(c.name||'')+'"></div></div><div class="row"><div class="field"><label>عملیات</label><select id="eo'+i+'">'+ops.map(x=>'<option '+((c.op||c.action||'add')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>مقدار / متن</label><input id="ev'+i+'" value="'+esc(c.value??c.count??c.text??'')+'"></div></div><button class="danger" onclick="syncLogicEditorDraft();logicEffects.splice('+i+',1);renderLogicEditor()">حذف اثر</button></div>'}).join('');card.innerHTML='<div class="panel-head">ویرایشگر بصری منطق انتخاب <button onclick="closePreview()">بستن</button></div><p class="muted">شرط‌ها باید همگی برقرار باشند تا انتخاب نمایش داده شود. اثرها پس از انتخاب اجرا می‌شوند.</p><div class="section-title">شرط‌ها</div>'+cond+'<button onclick="addConditionRow()">＋ افزودن شرط</button><div class="section-title">رویدادها و اثرها</div>'+eff+'<button onclick="addEffectRow()">＋ افزودن اثر</button><div style="margin-top:15px"><button class="primary" onclick="saveLogicEditor()">ذخیره منطق</button></div>';$('modal').classList.add('open')}
function editLogic(i){logicChoiceIndex=i;const c=scene(active).choices[i];logicConditions=JSON.parse(JSON.stringify(c.conditions||[]));logicEffects=JSON.parse(JSON.stringify(c.effects||[]));renderLogicEditor()}
function saveLogicEditor(){const c=scene(active).choices[logicChoiceIndex];c.conditions=logicConditions.map((_,i)=>{const type=$('ct'+i).value,name=$('cn'+i).value.trim(),op=$('co'+i).value,raw=$('cv'+i).value;return {type,name,op,value:type==='flag'?raw==='true':type==='quest'?raw:Number(raw)}});c.effects=logicEffects.map((_,i)=>{const type=$('et'+i).value,name=$('en'+i).value.trim(),operation=$('eo'+i)?.value||'add',raw=$('ev'+i).value;if(type==='journal')return {type,text:raw};if(type==='item')return {type,name,action:operation,count:Math.max(0,Number(raw)||1)};if(type==='quest')return {type,name,action:operation};if(type==='flag')return {type,name,value:raw==='true'};return {type,name,op:operation,value:Number(raw)||0}});closePreview();renderInspector();renderGraph();persist();toast('شرط‌ها و رویدادها ذخیره شدند')}

ensureProjectShape();
loadLocal().then(()=>{ensureProjectShape();active=project.meta.start_scene;render()});
</script></body></html>
