[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monn-lang"
version = "1.2.0"
description = "Persian-first language and narrative game engine for desktop and web"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "AmirHosseinNzafat"}]

[project.optional-dependencies]
images = ["Pillow>=10.0"]
3d = ["trimesh>=4.0", "matplotlib>=3.8"]
all = ["Pillow>=10.0", "trimesh>=4.0", "matplotlib>=3.8"]

[project.scripts]
monn = "monn_cli:main"
