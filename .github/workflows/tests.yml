name: Monn checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Monn
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Compile
        run: python -m compileall -q monn monn_cli.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Export sample browser game
        run: monn examples/story_adventure.mongame.json --game --web --output /tmp/monn-story.html
